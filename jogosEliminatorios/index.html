<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogos Eliminatórios</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Jogos Eliminatórios ⚽</h1>

      <div class="input-area">
        <input type="text" id="clube" placeholder="Digite o nome do clube" />

        <button id="btnAdicionar">Adicionar</button>
      </div>

      <button id="btnGerar">Gerar Tabela</button>

      <div class="resultado">
        <h2>Clubes adicionados:</h2>
        <p id="listaClubes">Nenhum clube cadastrado.</p>

        <h2>Confrontos:</h2>
        <p id="listaJogos">Aguardando geração...</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
