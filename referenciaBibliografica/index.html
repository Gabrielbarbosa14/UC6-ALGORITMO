<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Referência Bibliográfica</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        background-color: white;
        width: 400px;
        padding: 30px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 15px 0;
        box-sizing: border-box;
      }

      button {
        padding: 10px 20px;
        cursor: pointer;
      }

      #resultado {
        margin-top: 20px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Referência Bibliográfica</h1>

      <input type="text" id="nome" placeholder="Digite o nome completo" />

      <button id="btnGerar">Gerar Referência</button>

      <p id="resultado"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
