<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício Supermercado</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2937;
        background: #eef2ff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
      }

      .card {
        width: min(480px, calc(100% - 32px));
        padding: 28px 26px;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 22px 50px rgba(15, 23, 42, 0.12);
      }

      h1 {
        margin: 0 0 18px;
        font-size: 2rem;
        letter-spacing: -0.02em;
      }

      p.description {
        margin: 0 0 24px;
        line-height: 1.6;
        color: #4b5563;
      }

      .field {
        display: grid;
        gap: 10px;
        margin-bottom: 18px;
      }

      label {
        font-size: 0.95rem;
        color: #374151;
      }

      input[type="text"],
      input[type="number"] {
        width: 80%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        font-size: 1rem;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      input[type="text"]:focus,
      input[type="number"]:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.14);
      }

      #calcularPromocao {
        width: 100%;
        padding: 14px 16px;
        border: none;
        border-radius: 14px;
        background: #6366f1;
        color: #ffffff;
        font-size: 1rem;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }

      #calcularPromocao:hover {
        background: #4f46e5;
        transform: translateY(-1px);
      }

      #saidaPromocao {
        margin-top: 18px;
        font-size: 1.1rem;
        color: #111827;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Super Promoção</h1>
      <p class="description">
        Na compra de três unidades de um produto, o terceiro produto custa
        apenas 50% do seu valor.
      </p>
      <div class="field">
        <label for="produto">Produto:</label>
        <input type="text" id="produto" />
      </div>
      <div class="field">
        <label for="preco">Preço unitário:</label>
        <input type="number" id="preco" />
      </div>
      <input type="button" value="Calcular Promoção" id="calcularPromocao" />
      <h1 id="saidaPromocao"></h1>
    </div>
    <script src="script.js"></script>
  </body>
</html>
