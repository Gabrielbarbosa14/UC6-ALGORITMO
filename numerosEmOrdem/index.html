<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Números em Ordem</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Números em Ordem 🔢</h1>

      <div class="input-area">
        <input type="number" id="numero" placeholder="Digite um número" />

        <button id="btnAdicionar">Adicionar</button>
      </div>

      <button id="btnVerificar">Verificar Ordem</button>

      <button id="btnLimpar">Nova Lista</button>

      <div class="resultado">
        <h2>Números adicionados:</h2>
        <p id="listaNumeros">Nenhum número adicionado.</p>

        <h2>Resultado:</h2>
        <p id="resultado">Aguardando verificação...</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
